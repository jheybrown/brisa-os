# Brisa — lançador de aplicações.
[main]
font=Inter:size=12
icon-theme=Papirus
terminal=foot
prompt="Procurar  "
width=42
lines=9
horizontal-pad=22
vertical-pad=18
inner-pad=10
line-height=30
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=161c34fc
text=f2f4faff
prompt=a9b2ccff
input=f2f4faff
match=7ab8ffff
selection=0a84ffff
selection-text=ffffffff
selection-match=ffffffff
border=ffffff24

[border]
width=1
radius=10
