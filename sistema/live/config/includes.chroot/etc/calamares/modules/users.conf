# Página do utilizador no instalador do Brisa.
# Igual à do Debian, mas sem a verificação de dicionário: a imagem não traz o dicionário
# de palavras comuns e, com a verificação ligada, qualquer palavra-passe dava o erro
# "falha a verificação do dicionário - error loading dictionary".
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
        - dictcheck=0
