# Brisa — configuração do compositor Wayfire.
# Pode ser alterada à mão ou com as "Definições do ambiente" (wcm).

[core]
plugins = alpha animate autostart command decoration fast-switcher foreign-toplevel grid gtk-shell idle ipc ipc-rules move place resize scale shortcuts-inhibit switcher wayfire-shell window-rules wm-actions xdg-activation
close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 1
vheight = 1
preferred_decoration_mode = client
xwayland = true
background_color = 0.93 0.95 1.0 1.0

[input]
xkb_layout = pt
tap_to_click = true
natural_scroll = false
disable_touchpad_while_typing = true
cursor_theme = Adwaita
cursor_size = 24

# Programas da sessão
[autostart]
autostart_wf_shell = false
ambiente = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
pastas = xdg-user-dirs-update
fundo = brisa-fundo
barras = brisa-barras
avisos = mako
permissoes = lxpolkit
rede = nm-applet --indicator
widgets = brisa-widgets
instalador = brisa-instalar --arranque

# Transições ao abrir e fechar janelas
[animate]
open_animation = zoom
close_animation = zoom
duration = 130ms
zoom_duration = 140ms
fade_duration = 110ms
startup_duration = 250ms

# Barra de título das aplicações que não desenham a sua (Wine, terminal)
[decoration]
font = Inter SemiBold 10
title_height = 34
border_size = 2
button_order = minimize maximize close
active_color = #3B4560FF
inactive_color = #6B7790FF

# Encaixe: arrastar para uma margem, ou Super + setas
[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 12
quarter_snap_threshold = 50
preview_base_color = 0.18 0.48 0.96 0.30
preview_base_border = 0.18 0.48 0.96 0.80
preview_border_width = 2

[resize]
activate = <super> BTN_RIGHT

[grid]
duration = 130ms
type = crossfade
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN

[place]
mode = center

# Vista geral de todas as janelas
[scale]
toggle = <super> KEY_W
duration = 170ms
spacing = 40
include_minimized = true
inactive_alpha = 0.9
title_font_size = 14

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[wm-actions]
minimize = <super> KEY_M
toggle_showdesktop = <super> KEY_D
toggle_fullscreen = <super> KEY_F

[idle]
dpms_timeout = 600
screensaver_timeout = -1

# Atalhos
[command]
binding_lancador = <super> KEY_SPACE
command_lancador = brisa-lancador
binding_menu = <super> KEY_ESC
command_menu = brisa-menu
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_ficheiros = <super> KEY_E
command_ficheiros = thunar
binding_captura = KEY_SYSRQ
command_captura = sh -c 'mkdir -p "$(xdg-user-dir PICTURES)" && grim "$(xdg-user-dir PICTURES)/captura-$(date +%Y%m%d-%H%M%S).png" && notify-send "Captura de ecrã guardada" "Está na pasta Imagens."'
repeatable_binding_som_mais = KEY_VOLUMEUP
command_som_mais = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_som_menos = KEY_VOLUMEDOWN
command_som_menos = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_som_mudo = KEY_MUTE
command_som_mudo = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
repeatable_binding_brilho_mais = KEY_BRIGHTNESSUP
command_brilho_mais = brightnessctl set +5%
repeatable_binding_brilho_menos = KEY_BRIGHTNESSDOWN
command_brilho_menos = brightnessctl set 5%-
