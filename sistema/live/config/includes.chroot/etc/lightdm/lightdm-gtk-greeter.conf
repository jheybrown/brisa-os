# Ecrã de início de sessão do Brisa: fundo Aurora, tema escuro e a letra do sistema.
[greeter]
background=/usr/share/brisa/fundos/aurora.png
user-background=false
theme-name=Adwaita-dark
icon-theme-name=Papirus-Dark
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
indicators=~host;~spacer;~clock;~spacer;~language;~session;~a11y;~power
clock-format=%a %e %b · %H:%M
position=50%,center 55%,center
default-user-image=/usr/share/brisa/icones/brisa.png
hide-user-image=false
